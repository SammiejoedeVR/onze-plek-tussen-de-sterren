<div id="count">1 / 21</div>
<div id="hint">Tik om verder te gaan</div>

<div class="veil" id="rot">
  <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"></rect><path d="M8 3.5 6 5.5l2 2"></path></svg>
  <strong>Draai je telefoon</strong>
  <p>Deze presentatie is liggend gemaakt. Draai je toestel een kwartslag.</p>
</div>

<div class="veil show" id="start">
  <strong>Onze Plek Tussen De Sterren</strong>
  <p id="startcopy">Tik rechts op het scherm om verder te gaan, links om terug te gaan.</p>
  <button type="button" id="go">Presentatie starten</button>
</div>

<script>
(function () {
  var imgs = document.querySelectorAll('#stage img');
  var count = document.getElementById('count');
  var hint = document.getElementById('hint');
  var rot = document.getElementById('rot');
  var start = document.getElementById('start');
  var i = 0, started = false;
  var root = document.documentElement;
  var fs = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!fs) document.getElementById('startcopy').innerHTML =
    'Tik rechts op het scherm om verder te gaan, links om terug te gaan.<br><br>Voor beeldvullend: tik op het deel-icoon onderin Safari en kies \u201cZet op beginscherm\u201d \u2014 dan opent hij zonder browserbalk.';

  function show(n) {
    n = Math.max(0, Math.min(imgs.length - 1, n));
    imgs[i].classList.remove('on');
    i = n;
    imgs[i].classList.add('on');
    count.textContent = (i + 1) + ' / ' + imgs.length;
    try { localStorage.setItem('ops-slide', String(i)); } catch (e) {}
  }
  try { var s = parseInt(localStorage.getItem('ops-slide'), 10); if (s > 0) { i = 0; } } catch (e) {}
  imgs[0].classList.add('on');
  count.textContent = '1 / ' + imgs.length;

  function sync() {
    var portrait = window.innerHeight > window.innerWidth;
    rot.classList.toggle('show', portrait);
    start.classList.toggle('show', !portrait && !started);
  }
  window.addEventListener('resize', sync);
  window.addEventListener('orientationchange', function () { setTimeout(sync, 250); });
  sync();

  document.getElementById('go').addEventListener('click', function (e) {
    e.stopPropagation();
    started = true; sync();
    if (fs) { try { fs.call(root, { navigationUI: 'hide' }); } catch (err) { try { fs.call(root); } catch (e2) {} } }
    if (screen.orientation && screen.orientation.lock) { try { screen.orientation.lock('landscape'); } catch (err) {} }
    setTimeout(function () { hint.style.opacity = '0'; }, 2800);
  });

  function tryFs() {
    if (!fs || document.fullscreenElement || document.webkitFullscreenElement) return;
    try { fs.call(root, { navigationUI: 'hide' }); } catch (err) { try { fs.call(root); } catch (e2) {} }
  }

  document.addEventListener('click', function (e) {
    if (!started || e.target.tagName === 'BUTTON') return;
    tryFs();
    show(e.clientX / window.innerWidth < 0.25 ? i - 1 : i + 1);
    hint.style.opacity = '0';
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ') show(i + 1);
    if (e.key === 'ArrowLeft') show(i - 1);
  });
})();
</script>
